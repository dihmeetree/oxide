cluster:
  network:
    cni:
      name: none
    podSubnets:
      - 10.0.16.0/20
    serviceSubnets:
      - 10.0.8.0/21
machine:
  kubelet:
    extraArgs:
      cloud-provider: external
      rotate-server-certificates: true
    nodeIP:
      validSubnets:
        - 10.0.1.0/24
  network:
    interfaces:
      - interface: eth0
        dhcp: true
      - interface: eth1
        dhcp: true
  sysctls:
    net.core.somaxconn: "65535"
    net.core.netdev_max_backlog: "4096"
  time:
    servers:
      - ntp1.hetzner.de
      - ntp2.hetzner.com
      - ntp3.hetzner.net
      - time.cloudflare.com
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
      resolveMemberNames: true
