[package]
name = "oxide"
version = "0.0.1"
edition = "2021"
authors = ["Oxide - Talos Kubernetes with Cilium"]

[dependencies]
# HTTP client for Hetzner Cloud API
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
# Error handling
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4.0", features = ["derive"] }
# Time handling
chrono = { version = "0.4", features = ["serde"] }
# Base64 encoding for cloud-init
base64 = "0.22"
# Random generation for ED25519 SSH key seeding (uses the same rand_core
# version expected by ed25519-dalek so OsRng implements its CryptoRngCore bound)
rand_core = { version = "0.6", features = ["getrandom"] }
# ED25519 SSH key generation
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# URL handling
url = "2.5"
urlencoding = "2.1"
# Web framework for dashboard
axum = "0.8.6"
# HTML templating
askama = { version = "0.16", features = ["serde_json"] }
# Tower middleware for serving static files
tower-http = { version = "0.6", features = ["fs", "trace", "compression-full", "set-header"] }
tower = "0.5"
# Lock-free concurrent HashMap
dashmap = "6.1"
# Async trait support for the command runner abstraction
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.10"

# Performance-optimized build profiles
[profile.release]
# Link-time optimization for better performance
lto = true
# Enable all optimizations
opt-level = 3
# Reduce binary size by removing debug info
debug = false
# Panic strategy for smaller binaries
panic = "abort"
# Optimize for performance over compile time
codegen-units = 1
# Strip symbols for smaller binary
strip = true

[profile.dev]
# Faster incremental builds in development
opt-level = 1
# Keep debug info for better debugging
debug = true
# Faster linking in dev
lto = false