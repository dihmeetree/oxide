cluster_name: oxide-cluster

hcloud:
  # Hetzner Cloud API token
  # You can also set this via HCLOUD_TOKEN environment variable
  # token: your-token-here

  # Data center location
  # Options: nbg1, fsn1, hel1, ash, hil, sin
  location: nbg1

  network:
    # Private network CIDR
    cidr: 10.0.0.0/16

    # Subnet CIDR (must be within the network CIDR)
    subnet_cidr: 10.0.1.0/24

    # Network zone
    # Options: eu-central, us-east, us-west, ap-southeast
    zone: eu-central

talos:
  # Talos Linux version
  # See: https://github.com/siderolabs/talos/releases
  version: v1.11.2

  # Kubernetes version
  kubernetes_version: 1.34.1

  # Hetzner Cloud snapshot ID containing Talos image (REQUIRED)
  # To create a snapshot:
  # 1. Create a server with Ubuntu image
  # 2. Boot into rescue mode
  # 3. Run: wget -O - https://github.com/siderolabs/talos/releases/download/v1.7.0/hcloud-amd64.raw.xz | xz -d | dd of=/dev/sda && sync
  # 4. Reboot the server
  # 5. Create a snapshot from the Hetzner Cloud console
  # 6. Use the snapshot ID (number) here
  hcloud_snapshot_id: "123456789" # Replace with your snapshot ID

  # Cluster endpoint (optional - defaults to first control plane IP)
  # cluster_endpoint: https://your-domain.com:6443

  # Additional Talos machine config patches (optional)
  config_patches: []

cilium:
  # Cilium version
  # See: https://github.com/cilium/cilium/releases
  version: 1.17.8

  # Enable Hubble observability platform
  enable_hubble: true

  # Enable IPv6 support
  enable_ipv6: false

  # Additional Helm values (optional)
  # helm_values:
  #   hubble:
  #     metrics:
  #       enabled:
  #         - dns
  #         - drop
  #         - tcp
  #         - flow

# Prometheus monitoring stack (optional)
prometheus:
  # kube-prometheus-stack Helm chart version
  # See: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
  version: 77.13.0

  # Enable Prometheus installation
  enabled: true

  # Kubernetes namespace for Prometheus stack
  namespace: monitoring

  # Enable Grafana dashboards
  enable_grafana: true

  # Enable AlertManager for alerting
  enable_alertmanager: true

  # Prometheus data retention period
  retention: 30d

  # Prometheus persistent storage size
  storage_size: 50Gi

  # Enable persistent storage for Prometheus
  enable_persistent_storage: false

  # Additional Helm values (optional)
  # helm_values:
  #   prometheus:
  #     prometheusSpec:
  #       resources:
  #         requests:
  #           cpu: 500m
  #           memory: 2Gi

# Kubernetes Cluster Autoscaler with Hetzner support (optional)
# autoscaler:
#   # Enable cluster autoscaler
#   enabled: true
#
#   # Cluster autoscaler version
#   # See: https://github.com/kubernetes/autoscaler/releases
#   version: v1.34.0
#
#   # Worker pools to autoscale
#   worker_pools:
#     - name: worker-pool
#       server_type: cpx11  # Hetzner server type
#       location: fsn1      # Hetzner location
#       min_nodes: 1
#       max_nodes: 10

# Control plane nodes
control_planes:
  - name: control-plane
    # Hetzner server type
    # Small: cx21 (2 vCPUs, 4GB RAM)
    # Medium: cpx21 (3 vCPUs, 4GB RAM) - Recommended
    # Large: cpx31 (4 vCPUs, 8GB RAM)
    server_type: cpx21

    # Number of control plane nodes (1 or 3 recommended for production)
    count: 3

    # Additional Kubernetes labels (optional)
    labels: {}

# Worker nodes
workers:
  - name: worker
    # Hetzner server type
    # Small: cx31 (2 vCPUs, 8GB RAM)
    # Medium: cpx31 (4 vCPUs, 8GB RAM) - Recommended
    # Large: cpx41 (8 vCPUs, 16GB RAM)
    # XLarge: cpx51 (16 vCPUs, 32GB RAM)
    server_type: cpx31

    # Number of worker nodes
    count: 3

    # Additional Kubernetes labels (optional)
    labels: {}

  # You can define multiple worker pools with different specs:
  # - name: worker-large
  #   server_type: cpx51
  #   count: 2
  #   labels:
  #     workload: memory-intensive
