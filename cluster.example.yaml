cluster_name: oxide-cluster

hcloud:
  # Hetzner Cloud API token
  # You can also set this via HCLOUD_TOKEN environment variable
  # token: your-token-here

  # Data center location
  # Options: nbg1, fsn1, hel1, ash, hil, sin
  location: nbg1

  network:
    # Private network CIDR
    cidr: 10.0.0.0/16

    # Subnet CIDR (must be within the network CIDR)
    subnet_cidr: 10.0.1.0/24

    # Network zone
    # Options: eu-central, us-east, us-west, ap-southeast
    zone: eu-central

talos:
  # Talos Linux version
  # See: https://github.com/siderolabs/talos/releases
  version: v1.11.2

  # Kubernetes version
  kubernetes_version: 1.34.1

  # Hetzner Cloud snapshot ID containing Talos image (REQUIRED)
  # To create a snapshot using rescue mode:
  # 1. Create a temporary server: hcloud server create --type cx11 --name talos-snapshot --image ubuntu-22.04 --location nbg1
  # 2. Enable rescue mode: hcloud server enable-rescue talos-snapshot && hcloud server reboot talos-snapshot
  # 3. SSH into rescue system: ssh root@<server-ip>
  # 4. Download and write Talos image:
  #    cd /tmp
  #    wget -O /tmp/talos.raw.xz https://factory.talos.dev/image/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba/v1.11.0/hcloud-amd64.raw.xz
  #    xz -d -c /tmp/talos.raw.xz | dd of=/dev/sda && sync
  #    shutdown -h now
  # 5. Create snapshot: hcloud server create-image --type snapshot --description "Talos v1.11.0" talos-snapshot
  # 6. Get snapshot ID: hcloud image list
  # 7. Delete temporary server: hcloud server delete talos-snapshot
  # Alternative: Use Packer (see terraform-hcloud-talos/_packer directory or https://www.talos.dev/v1.11/talos-guides/install/cloud-platforms/hetzner/)
  hcloud_snapshot_id: "123456789" # Replace with your snapshot ID

  # Cluster endpoint (optional - defaults to first control plane IP)
  # cluster_endpoint: https://your-domain.com:6443

  # Additional Talos machine config patches (optional)
  config_patches: []

cilium:
  # Cilium version
  # See: https://github.com/cilium/cilium/releases
  version: 1.17.8

  # Enable Hubble observability platform
  enable_hubble: true

  # Enable IPv6 support
  enable_ipv6: false

  # Additional Helm values (optional)
  # helm_values:
  #   hubble:
  #     metrics:
  #       enabled:
  #         - dns
  #         - drop
  #         - tcp
  #         - flow

# Prometheus monitoring stack (optional)
prometheus:
  # kube-prometheus-stack Helm chart version
  # See: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
  version: 77.13.0

  # Enable Prometheus installation
  enabled: true

  # Kubernetes namespace for Prometheus stack
  namespace: monitoring

  # Enable Grafana dashboards
  enable_grafana: true

  # Enable AlertManager for alerting
  enable_alertmanager: true

  # Prometheus data retention period
  retention: 30d

  # Prometheus persistent storage size
  storage_size: 50Gi

  # Enable persistent storage for Prometheus
  enable_persistent_storage: false

  # Additional Helm values (optional)
  # helm_values:
  #   prometheus:
  #     prometheusSpec:
  #       resources:
  #         requests:
  #           cpu: 500m
  #           memory: 2Gi

# Kubernetes Metrics Server (required for HPA and kubectl top commands)
metrics_server:
  # Enable metrics server installation
  enabled: true

# Kubernetes Cluster Autoscaler with Hetzner support
autoscaler:
  # Enable cluster autoscaler
  enabled: true

  # Cluster autoscaler version
  # See: https://github.com/kubernetes/autoscaler/releases
  version: v1.34.0

  # Worker pools to autoscale
  # IMPORTANT: Set min_nodes to 0 so the autoscaler only manages nodes it creates,
  # and never touches the initial worker nodes created at cluster initialization.
  # This ensures your base worker nodes (defined in workers.count below) always remain.
  worker_pools:
    - name: worker-pool
      server_type: cpx11 # Hetzner server type
      location: fsn1 # Hetzner location
      min_nodes: 0 # Only autoscale above the initial worker count
      max_nodes: 10

# Control plane nodes
control_planes:
  - name: control-plane
    # Hetzner server type
    # Shared vCPU (AMD EPYC):
    #   - cpx11 (2 vCPUs, 2GB RAM, 40GB) - Not recommended for control plane
    #   - cpx21 (3 vCPUs, 4GB RAM, 80GB) - Recommended for small/medium clusters
    #   - cpx31 (4 vCPUs, 8GB RAM, 160GB) - Recommended for large clusters
    # Dedicated vCPU (AMD EPYC):
    #   - ccx13 (2 vCPUs, 8GB RAM, 80GB) - High-performance option
    #   - ccx23 (4 vCPUs, 16GB RAM, 160GB) - Enterprise-grade
    server_type: cpx21

    # Number of control plane nodes (1 or 3 recommended for production)
    count: 3

    # Additional Kubernetes labels (optional)
    labels: {}

# Worker nodes
workers:
  - name: worker
    # Hetzner server type
    # Shared vCPU (AMD EPYC):
    #   - cpx11 (2 vCPUs, 2GB RAM, 40GB) - Minimal workloads
    #   - cpx21 (3 vCPUs, 4GB RAM, 80GB) - Light workloads
    #   - cpx31 (4 vCPUs, 8GB RAM, 160GB) - Recommended for general use
    #   - cpx41 (8 vCPUs, 16GB RAM, 240GB) - Memory-intensive workloads
    #   - cpx51 (16 vCPUs, 32GB RAM, 360GB) - High-performance workloads
    # Dedicated vCPU (AMD EPYC):
    #   - ccx13 (2 vCPUs, 8GB RAM, 80GB) - Dedicated compute, low-medium load
    #   - ccx23 (4 vCPUs, 16GB RAM, 160GB) - Dedicated compute, medium load
    #   - ccx33 (8 vCPUs, 32GB RAM, 240GB) - Dedicated compute, high load
    #   - ccx43 (16 vCPUs, 64GB RAM, 360GB) - Very high performance
    #   - ccx53 (32 vCPUs, 128GB RAM, 600GB) - Maximum performance
    #   - ccx63 (48 vCPUs, 192GB RAM, 960GB) - Enterprise-grade maximum
    server_type: cpx31

    # Number of worker nodes
    count: 3

    # Additional Kubernetes labels (optional)
    labels: {}

  # You can define multiple worker pools with different specs:
  # - name: worker-large
  #   server_type: cpx51
  #   count: 2
  #   labels:
  #     workload: memory-intensive
